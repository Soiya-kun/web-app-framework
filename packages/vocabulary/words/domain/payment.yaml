- word: payment
  pos: noun
  forms: [payments]
  ja: 入金
  description: 顧客から受け取ったお金。振込人を特定できていない入金（仮受）もある。
- word: payer
  pos: noun
  forms: [payers]
  ja: 振込依頼人
  description: 入金の振込をした人の名前（銀行の明細に出る名前）。顧客の名前と違うことがある。
- word: transfer
  pos: noun
  ja: 振込
  description: 入金方法の1つ。銀行振込。
- word: cash
  pos: noun
  ja: 現金
  description: 入金方法の1つ。
- word: reconciliation
  pos: noun
  ja: 消込
  description: 入金を請求に充てる作業。1回の消込で、同じ請求先の入金と請求を複数まとめて扱える。
- word: allocation
  pos: noun
  ja: 充当
  description: 消込の中で、どの入金のいくらを、どの請求へ充てたか。
- word: adjustment
  pos: noun
  forms: [adjustments]
  ja: 調整
  description: 入金が請求に足りない分を、当社の負担として請求から差し引くこと（振込手数料・端数）。
- word: fee
  pos: noun
  ja: 手数料
  description: transfer fee（振込手数料）で使う。顧客が入金額から差し引いた振込の手数料。
- word: difference
  pos: noun
  ja: 差額
  description: small difference（端数差額）で使う。請求と入金の少額の差。
- word: refund
  pos: noun
  forms: [refunds]
  ja: 返金
  description: 請求に充てない入金（過入金・二重入金・他社宛の誤入金）を、振込人へ返すこと。
- word: carried
  pos: adjective
  ja: 繰越
  description: carried amount（繰越額）で使う。前回請求額から今回入金額と調整額を引いた残り。負は前受。
- word: correction
  pos: noun
  ja: 訂正
  description: 調整の区分の1つ。発行した請求に載せた入金などの誤りを、次の請求で直す（正負どちらも）。
