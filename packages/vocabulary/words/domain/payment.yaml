# 業務の単語。description は用語集に出す。
- { id: payment, category: noun, en: { plural: payments }, ja: { form: 入金 }, description: 顧客から受け取ったお金。振込人を特定できていない入金（仮受）もある。 }
- { id: payer, category: noun, en: { plural: payers }, ja: { form: 振込依頼人 }, description: 入金の振込をした人の名前（銀行の明細に出る名前）。顧客の名前と違うことがある。 }
- { id: transfer, category: noun, ja: { form: 振込 }, description: 入金方法の1つ。銀行振込。 }
- { id: cash, category: noun, ja: { form: 現金 }, description: 入金方法の1つ。 }
- { id: adjustment, category: noun, en: { plural: adjustments }, ja: { form: 調整 }, description: 請求先の残高を、入金でなく当社の判断で減らす（正）・増やす（負）こと。 }
- { id: fee, category: noun, ja: { form: 手数料, attach: direct }, description: 振込手数料（transfer fee）で使う。顧客が入金額から差し引いた振込の手数料。 }
- { id: difference, category: noun, ja: { form: 差額, attach: direct }, description: 端数差額（small difference）で使う。 }
- { id: refund, category: noun, en: { plural: refunds }, ja: { form: 返金 }, description: 請求に充てない入金（過入金・二重入金・他社宛の誤入金）を、振込人へ返すこと。 }
- { id: carried, category: adjective, ja: { stem: 繰越, class: prefix }, description: 繰越額（carried amount）で使う。 }
- { id: correction, category: noun, ja: { form: 訂正 }, description: 調整の区分の1つ。発行した請求に載せた入金などの誤りを、次の請求で直す（正負どちらも）。 }
- { id: unidentified, category: adjective, ja: { stem: 仮受, class: no }, description: 振込人を特定できていない入金の状態（仮受）。identify の否定からは作らず、業務の言葉にする。 }
