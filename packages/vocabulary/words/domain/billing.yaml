# 業務の単語。description は用語集に出す。
- { id: invoice, category: noun, en: { plural: invoices }, ja: { form: 請求 }, description: 請求先ごと・締め日ごとに売上・入金・返金・調整をまとめ、前回からの残高を繰り越して請求する単位。発行すると変えない。 }
- { id: collection, category: noun, ja: { form: 回収 }, description: 請求した代金を受け取ること。回収月・回収日から入金期日を決める。 }
- { id: tax, category: noun, en: { plural: taxes }, ja: { form: 税 }, description: 消費税。請求ごと・税率ごとに、税抜の合計から計算する（1円未満は 0 の方へ切り捨て）。 }
- { id: taxable, category: adjective, ja: { stem: 課税対象, class: no }, description: 消費税をかける対象の（税抜の金額）。 }
- { id: offset, category: noun, ja: { form: 月数 }, description: 回収月（collection month offset）で使う。締め日から何か月後に回収するか。 }
- { id: return, category: noun, ja: { form: 返品 }, description: 売上区分の1つ。売った品の返品。負の金額で持つ。 }
- { id: discount, category: noun, ja: { form: 値引 }, description: 売上区分の1つ。売った後の値引き。負の金額で持つ。 }
- { id: backdated, category: adjective, ja: { stem: 過去日付, class: no }, description: 締めた後に、締め日以前の日付で登録した売上など。まだどの請求にも載っていないので、次の締めで載る。 }
- { id: overdue, category: adjective, ja: { stem: 期日超過, class: no }, description: 入金期日を過ぎても、請求の代金を受け取っていないこと。次の請求の繰越額と入金期日から求める。 }
