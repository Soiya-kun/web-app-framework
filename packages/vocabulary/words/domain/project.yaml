# 受託開発の進め方の言葉（役割・打合せ・議事録・課題）。description は用語集に出す。
- { id: role, category: noun, ja: { form: 役割 }, description: 業務や打合せでの人の役目。議事録や業務フローには、人の名前でなく役割を書く。 }
- { id: side, category: noun, ja: { form: 立場 }, description: 役割がどちら側か。開発チーム・業務部門・外のどれか。 }
- { id: vendor, category: noun, ja: { form: 開発チーム }, description: システムを作る側（受託した側）。PM・エンジニアなど。 }
- { id: business, category: noun, ja: { form: 業務部門 }, description: システムを使う側（発注した会社で業務をする人）。経理担当・営業担当・承認者など。 }
- { id: project, category: noun, ja: { form: プロジェクト }, description: 受託したシステムの開発。 }
- { id: manager, category: noun, ja: { form: マネージャー, attach: direct }, description: 進め方と合意をまとめる人（PM）。 }
- { id: engineer, category: noun, ja: { form: エンジニア }, description: 業務フロー・シナリオ・処理を書く開発チームの人。 }
- { id: approver, category: noun, ja: { form: 承認者 }, description: 業務部門で、返金などの業務を承認する人。 }
- { id: meeting, category: noun, ja: { form: 打合せ }, description: 業務部門と開発チームで要件を話し、決める場。1回ごとに議事録を残す。 }
- { id: minutes, category: noun, en: { plural: minutes }, ja: { form: 議事録 }, description: 打合せで決めたことと挙がった課題の記録。文字起こしやメモから作り、開発チームと業務部門がレビューする。 }
- { id: agenda, category: noun, ja: { form: 議題 }, description: 打合せで話す業務フロー・シナリオ。 }
- { id: attendee, category: noun, ja: { form: 出席者 }, description: 打合せに出た役割。 }
- { id: question, category: noun, ja: { form: 課題 }, description: 打合せで挙がった、決めなければならないこと。関係する業務フロー・シナリオ・拡張などに付け、担当の役割と期限を持つ。後の打合せで決めると解決する。 }
- { id: deadline, category: noun, ja: { form: 期限 }, description: 課題を解決する期限。 }
- { id: assignee, category: noun, ja: { form: 担当者 }, description: 課題を解決する役割。 }
- { id: raise, category: verb, ja: { dictionary: 挙げる, class: ichidan }, description: 打合せで課題を挙げること。 }
- { id: resolve, category: verb, en: { past: resolved }, ja: { stem: 解決, class: suru }, description: 前の打合せで挙がった課題を、後の打合せで決めて片付けること。 }
- { id: legacy, category: adjective, ja: { stem: 現行, class: no }, description: いまの業務と旧システム（AsIs）のこと。現行の業務フローは、新しい業務フロー（ToBe）のどれに置き換わるかを値で持つ。 }
- { id: replacement, category: noun, ja: { form: 置き換え }, description: 現行の業務・段が変わる先の、新しい業務フロー・シナリオ・段。 }
- { id: discontinue, category: verb, en: { noun: discontinuation }, ja: { stem: 廃止, class: suru }, description: 現行の業務・段が、新しい業務フローではなくなること。 }
- { id: same, category: adjective, ja: { stem: 同じ, class: no }, description: 現行と新しい業務フローで、同じ値の段（変わらない業務）。 }
- { id: estimate, category: verb, en: { noun: estimate }, ja: { stem: 見積, class: suru }, description: 受託開発の見積。項目の名前と金額が最小の単位で、対象（業務フロー・シナリオ・画面・処理・現行の業務フロー）を値で指せる。 }
