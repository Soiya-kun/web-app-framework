# システム向けの動詞。英語は原形（id）から語形（三単現・過去形・-ing・-able・un-過去分詞・名詞形）を作り、不規則なものだけ書く。
# 日本語は活用の型で持つ。suru は語幹（発行 → 発行する）。ichidan・godan は辞書形（締める・取り消す）と、要れば名詞形（締め・取消）。
# ja.label は、単独で見出し・ボタンにするときの形（なければ名詞形）。
- { id: create, en: { noun: creation }, ja: { stem: 登録, class: suru }, avoid: [add, insert] }
- { id: find, en: { past: found }, ja: { stem: 取得, class: suru }, avoid: [get] }
