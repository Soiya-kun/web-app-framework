# システム向けの動詞。ja は体言止めの形、jaVerb は「〜する」の形。
- word: create
  pos: verb
  ja: 登録
  jaVerb: 登録する
  en: Create
  avoid: [add, insert, register]
- word: find
  pos: verb
  ja: 取得
  jaVerb: 取得する
  avoid: [get]
- word: list
  pos: verb
  ja: 一覧取得
  jaVerb: 一覧取得する
- word: interpret
  pos: verb
  ja: 解釈
  jaVerb: 解釈する
  avoid: [parse]
- word: validate
  pos: verb
  ja: バリデーション
  jaVerb: バリデーションする
- word: restore
  pos: verb
  ja: 復元
  jaVerb: 復元する
- word: plan
  pos: verb
  ja: 計画
  jaVerb: 計画する
- word: assign
  pos: verb
  ja: 割り当て
  jaVerb: 割り当てる
- word: generate
  pos: verb
  ja: 生成
  jaVerb: 生成する
- word: reject
  pos: verb
  ja: 拒否
  jaVerb: 拒否する
- word: prepare
  pos: verb
  ja: 準備
  jaVerb: 準備する
  avoid: [make, setup, init, initialize]
- word: respond
  pos: verb
  ja: 応答
  jaVerb: 応答する
- word: read
  pos: verb
  ja: 読み取り
  jaVerb: 読み取る
- word: describe
  pos: verb
  ja: 説明
  jaVerb: 説明する
- word: submit
  pos: verb
  ja: 送信
  jaVerb: 送信する
- word: post
  pos: verb
  ja: POST 送信
  jaVerb: POST で送る
- word: render
  pos: verb
  ja: 描画
  jaVerb: 描画する
- word: expect
  pos: verb
  ja: 確認
  jaVerb: 確認する
- word: use
  pos: verb
  ja: 使用
  jaVerb: 使用する
- word: is
  pos: verb
  ja: 判定
  jaVerb: 判定する
- word: has
  pos: verb
  ja: 有無の判定
  jaVerb: 有無を判定する
- word: can
  pos: verb
  ja: 可否の判定
  jaVerb: 可否を判定する
- word: load
  pos: verb
  ja: 読み込み
  jaVerb: 読み込む
  forms: [loading]
- word: issue
  pos: verb
  ja: 発行
  jaVerb: 発行する
- word: define
  pos: verb
  ja: 定義
  jaVerb: 定義する
- word: execute
  pos: verb
  ja: 実行
  jaVerb: 実行する
- word: run
  pos: verb
  ja: 実行
  jaVerb: 実行する
- word: begin
  pos: verb
  ja: 開始
  jaVerb: 開始する
- word: commit
  pos: verb
  ja: 確定
  jaVerb: 確定する
- word: rollback
  pos: verb
  ja: 取り消し
  jaVerb: 取り消す
- word: apply
  pos: verb
  ja: 適用
  jaVerb: 適用する
- word: copy
  pos: verb
  ja: 写し取り
  jaVerb: 写し取る
- word: seed
  pos: verb
  ja: 投入
  jaVerb: 投入する
