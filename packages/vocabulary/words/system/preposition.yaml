# 前置詞。日本語は、名詞句（noun）・手順（step）・関数の題（title）の型で並べ替える。
# {head} は前置詞の前の語、{object} は前置詞の後ろの語、{verb} は動詞。
- { id: for, ja: { noun: '{object}用の{head}', step: '{object}用の{head}を{verb}', title: '{object}用の{head}の{verb}' } }
- { id: by, ja: { noun: '{object}別の{head}', step: '{object}で{head}を{verb}', title: '{object}での{head}の{verb}' } }
- { id: of, ja: { noun: '{object}の{head}', step: '{object}の{head}を{verb}', title: '{object}の{head}の{verb}' } }
- { id: from, ja: { noun: '{object}からの{head}', step: '{object}から{head}を{verb}', title: '{object}からの{head}の{verb}' } }
- { id: to, ja: { noun: '{object}への{head}', step: '{head}を{object}へ{verb}', title: '{head}の{object}への{verb}' } }
- { id: with, ja: { noun: '{object}付きの{head}', step: '{object}付きの{head}を{verb}', title: '{object}付きの{head}の{verb}' } }
- { id: on, ja: { noun: '{object}での{head}', step: '{object}で{head}を{verb}', title: '{object}での{head}の{verb}' } }
