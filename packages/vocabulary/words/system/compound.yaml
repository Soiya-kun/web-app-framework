# 複合語。部分の組合せでは訳が決まらない言い回しを、1つの概念として持つ（en.tokens は名前の中の単語の並び）。
# 組合せで決まるもの（売上＋金額 →「売上金額」、締め＋取消 →「締めの取消」）は書かない。
