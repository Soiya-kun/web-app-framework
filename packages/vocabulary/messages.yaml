# 画面の文。frame（文の型）で書いた文は、英語・日本語とも単語帳と文法から作る。
# frame: request（{object}を〜してください）・prompt（〜してください）・done（〜しました）・progress（〜しています…）・missing（{object}が見つかりません）。
# object は $field のような値（画面で埋める）か、単語帳の名詞の id。型に収まらない文だけ free に両方の言語で書く（数を見張る）。
- { key: inputRequired, frame: request, verb: enter, object: $field }
- { key: selectionRequired, frame: request, verb: select, object: $field }
- { key: selectionPrompt, frame: prompt, verb: select }
- { key: createCompleted, frame: done, verb: create }
- { key: closeCompleted, frame: done, verb: close }
- { key: issueCompleted, frame: done, verb: issue }
- { key: cancelCompleted, frame: done, verb: cancel }
- { key: identifyCompleted, frame: done, verb: identify, object: customer }
- { key: loading, frame: progress, verb: load }
- { key: missingTarget, frame: missing, object: target }
- key: invalidInput
  free: { ja: 入力に問題があります。, en: Some input is invalid. }
- key: integerRequired
  free: { ja: '{field}は整数で記入してください。', en: 'Enter {field} as a whole number.' }
- key: invalidRange
  free: { ja: '{field}は{minimum}から{maximum}までで記入してください。', en: 'Enter {field} between {minimum} and {maximum}.' }
- key: invalidDate
  free: { ja: '{field}は実在する日付を YYYY-MM-DD の形で記入してください。', en: 'Enter {field} as a valid date in YYYY-MM-DD.' }
- key: longText
  free: { ja: '{field}は{maximum}文字以内で記入してください。', en: 'Enter {field} in {maximum} characters or fewer.' }
- key: invalidRequest
  free: { ja: リクエストの形が正しくありません。, en: The request is malformed. }
- key: duplicateTarget
  free: { ja: 同じ対象がすでにあります。, en: The target already exists. }
- key: changedTarget
  free: { ja: 対象がほかの操作で変わりました。もう一度やり直してください。, en: The target was changed by another operation. Please try again. }
- key: unexpectedError
  free: { ja: 予期しないエラーが起きました。, en: An unexpected error occurred. }
- key: billingCustomerRequired
  free: { ja: '{field}は請求先（自分自身が請求先の顧客）を選んでください。', en: 'Select a billing customer for {field}.' }
- key: monthEndRequired
  free: { ja: '{field}は請求先の締日に合わせて月末の日にしてください。', en: 'Set {field} to the end of a month to match the closing day.' }
- key: closingDayRequired
  free: { ja: '{field}は請求先の締日に合わせて{closingDay}日にしてください。', en: 'Set {field} to day {closingDay} to match the closing day.' }
- key: earlyClosingDate
  free: { ja: '{field}は前回の請求締め日（{previousDate}）より後にしてください。', en: 'Set {field} after the previous closing date ({previousDate}).' }
- key: unissuedInvoice
  free: { ja: 前回の請求がまだ発行されていません。発行してから締めてください。, en: The previous invoice has not been issued yet. Issue it before closing. }
- key: emptyClosing
  free: { ja: 締める対象（前回からの残高・売上・入金・返金・調整）がありません。, en: 'There is nothing to close (no balance, sales, payments, refunds, or adjustments).' }
- key: issuedInvoice
  free: { ja: この請求はすでに発行されています。発行した請求は変えず、訂正は次の請求で行ってください。, en: This invoice has already been issued. Make corrections on the next invoice. }
- key: earlyIssueDate
  free: { ja: '{field}は請求締め日（{closingDate}）以後にしてください。', en: 'Set {field} on or after the closing date ({closingDate}).' }
- key: identifiedPayment
  free: { ja: この入金はすでに顧客を特定済みか、請求に載せています。, en: This payment already has a customer or is on an invoice. }
- key: paymentIdentified
  free: { ja: '{customer}の入金として記録しました。', en: 'Registered as a payment from {customer}.' }
- key: unidentifiedPayment
  free: { ja: 振込人を特定できなかったため、仮受として記録しました。入金の一覧で顧客を特定してください。, en: 'The payer could not be identified, so the payment was registered as unidentified. Identify the customer in the payment list.' }
- key: automaticSelection
  free: { ja: 振込依頼人名から自動で特定, en: Identify from the payer name }
- key: searchPrompt
  free: { ja: 名前の一部を入れてください（日本語でも英語でも探せます）。, en: Enter part of a name (Japanese or English). }
- key: returnMainline
  free: { ja: そのあと、本線の次の段へ戻る。, en: Then return to the next step of the mainline. }
- key: endCourse
  free: { ja: この経路はここで終える（本線へ戻らない）。, en: This course ends here without returning to the mainline. }
